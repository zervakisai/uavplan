[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flare"
version = "1.0.0"
description = "FLARE: a reproducible UAV planning benchmark for wildfire emergency response (formerly UAVBench)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "gymnasium>=0.29",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "scipy>=1.12",
]

[project.urls]
Homepage = "https://github.com/zervakisai/uavplan"
Repository = "https://github.com/zervakisai/uavplan"
Documentation = "https://github.com/zervakisai/uavplan#documentation"

[project.optional-dependencies]
viz = [
  "matplotlib>=3.8.0",
  "imageio>=2.31",
]
dev = [
  "pytest>=7.0",
  "mypy>=1.0",
]
pipeline = [
  "osmnx>=1.9",
  "geopandas>=0.14",
  "shapely>=2.0",
  "rasterio>=1.3",
]
analysis = [
  "pandas>=2.0",
]
all = [
  "flare[viz,dev,pipeline,analysis]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "contract_test_*.py", "unit_test_*.py", "integration_test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
flare = "flare.cli.benchmark:main"
uavbench = "flare.cli.benchmark:main"
